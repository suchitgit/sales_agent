# Optional in v2 — only for durable approval across restarts. Nothing else needs Docker.
services:
  postgres:
    image: postgres:16
    container_name: sales-postgres
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: sales, POSTGRES_PASSWORD: sales-sandbox-pw, POSTGRES_DB: sales }
    volumes: [pg_data:/var/lib/postgresql/data]
volumes: { pg_data: {} }
